<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">项目术语与规则 QA 示例</title>
  <desc id="desc">The repository's 20-cue fixture: Focus Mode translates as 专注模式. Deterministic QA passes with zero errors and one disclosed warning for Delta.</desc>
  <rect width="1280" height="720" fill="#fff"/>
  <g fill="#151515" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="64" y="82" font-size="36" font-weight="700">术语入库，核验有据。</text>
    <text x="1216" y="77" font-size="17" fill="#686868" text-anchor="end">仓库测试样例 · 20 条字幕</text>
    <path d="M64 112H1216M778 150V632M64 665H1216" stroke="#cecece"/>
    <text x="64" y="180" font-size="18" fill="#686868">英文原句</text>
    <text x="64" y="235" font-size="29">Today we're testing Focus Mode.</text>
    <text x="64" y="277" font-size="17" fill="#686868" font-family="SFMono-Regular, Consolas, monospace">00:00:03,200 → 00:00:06,400</text>
    <rect x="229" y="326" width="175" height="53" fill="#ffe79a"/>
    <text x="64" y="368" font-size="41">今天测试专注模式。</text>
    <text x="64" y="410" font-size="17" fill="#686868" font-family="SFMono-Regular, Consolas, monospace">00:00:03,200 → 00:00:06,400</text>
    <path d="M64 459H722" stroke="#cecece"/>
    <text x="64" y="513" font-size="18" fill="#686868">项目术语库</text>
    <text x="64" y="562" font-size="29">Focus Mode → 专注模式</text>
    <text x="64" y="613" font-size="19" fill="#686868">确认的译法，在项目内复用。</text>
    <text x="830" y="180" font-size="18" fill="#686868">规则 QA · 样例结果</text>
    <text x="830" y="245" font-size="40" font-weight="700">PASS</text>
    <path d="M830 264H942" stroke="#151515" stroke-width="2"/>
    <text x="830" y="321" font-size="22">原文 / 可读字幕</text><text x="1200" y="321" font-size="22" text-anchor="end">20 / 20</text>
    <text x="830" y="373" font-size="22">错误</text><text x="1200" y="373" font-size="22" text-anchor="end">0</text>
    <text x="830" y="425" font-size="22">警告</text><text x="1200" y="425" font-size="22" text-anchor="end">1</text>
    <path d="M830 459H1216" stroke="#cecece"/>
    <rect x="830" y="488" width="155" height="34" fill="#ffe79a"/>
    <text x="839" y="513" font-size="20">警告如实交付</text>
    <text x="830" y="562" font-size="21">第 5 条保留了拉丁字母 Delta。</text>
    <text x="830" y="607" font-size="17" fill="#686868">通过不等于没有警告。</text>
  </g>
</svg>
