name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Test deterministic workflow
        run: npm test
      - name: Validate repository and WorkBuddy package
        run: npm run validate
      - name: Install through the skills CLI
        run: npm run smoke:install
      - name: Run the installed skill
        run: node .agents/skills/subtitle-me/scripts/subtitle-me.mjs doctor
      - name: Run the neutral fixture through the installed skill
        run: node scripts/smoke-cli.mjs --cli .agents/skills/subtitle-me/scripts/subtitle-me.mjs

  package:
    name: Package WorkBuddy ZIP
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:workbuddy
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: subtitle-me-workbuddy
          path: dist/*.zip
